<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AWS Work Style · Goal-First Design</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --slide-w: 1920px;
    --slide-h: 1080px;
    --pad-x: 120px;
    --pad-top: 96px;
    --pad-bottom: 96px;
    --body-gap: 44px;

    --bg: #FFFFFF;
    --paper: #F8FAFC;
    --paper-2: #F1F5F9;

    --ink: #0F172A;
    --ink-2: #334155;
    --muted: #64748B;
    --muted-2: #94A3B8;
    --line: #E2E8F0;
    --line-strong: #CBD5E1;

    --amber: #F59E0B;
    --amber-dim: #D97706;
    --amber-soft: rgba(245, 158, 11, 0.10);
    --amber-border: rgba(245, 158, 11, 0.45);

    --pink: #EC4899;
    --pink-dim: #DB2777;
    --pink-soft: rgba(236, 72, 153, 0.08);

    --blue: #3B82F6;
    --blue-dim: #2563EB;
    --blue-soft: rgba(59, 130, 246, 0.07);

    --green: #16A34A;
    --green-dim: #15803D;
    --green-soft: rgba(22, 163, 74, 0.10);

    --danger: #B91C1C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #020617;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body {
    width: var(--slide-w);
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 0;
  }
  .slide-gap { width: var(--slide-w); height: 32px; background: transparent; }

  .slide {
    position: relative;
    width: var(--slide-w);
    height: var(--slide-h);
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    background: var(--bg);
    color: var(--ink);
    font-size: 30px;
    line-height: 1.55;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .s-page {
    position: absolute;
    right: 72px; bottom: 36px;
    font-size: 22px;
    color: var(--muted-2);
    letter-spacing: 0.14em;
    font-weight: 500;
  }

  .s-head { margin-bottom: 52px; }
  .s-head.tight { margin-bottom: 36px; }

  .s-tagline {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 20px;
  }
  .tag {
    display: inline-block;
    background: var(--blue);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.16em;
    padding: 8px 16px;
    border-radius: 6px;
  }
  .tag.amber { background: var(--amber); color: #FFFFFF; }
  .tag.pink  { background: var(--pink);  color: #FFFFFF; }
  .tag.ink   { background: var(--ink);   color: #FFFFFF; }
  .tag.green { background: var(--green); color: #FFFFFF; }

  .s-tagline-text {
    font-size: 24px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .s-kicker {
    font-size: 32px;
    font-weight: 400;
    color: var(--ink-2);
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }

  .s-title {
    font-size: 88px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .s-title .amber { color: var(--amber); }
  .s-title .pink  { color: var(--pink); }
  .s-title .blue  { color: var(--blue-dim); }
  .s-title .green { color: var(--green-dim); }
  .s-title .small { font-size: 60px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.02em; }

  .s-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--body-gap);
  }

  /* HERO */
  .layout-hero {
    --pad-x: 160px;
    justify-content: center;
    background:
      radial-gradient(ellipse at top right, var(--amber-soft) 0%, transparent 55%),
      radial-gradient(ellipse at bottom left, var(--pink-soft) 0%, transparent 50%),
      var(--bg);
  }
  .hero-label {
    font-size: 26px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 48px;
    display: flex; align-items: center; gap: 24px;
  }
  .hero-label::before {
    content: '';
    display: inline-block;
    width: 56px; height: 4px;
    background: var(--amber);
    border-radius: 2px;
  }
  .hero-title {
    font-size: 150px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.04em;
    color: var(--ink);
  }
  .hero-title .amber { color: var(--amber); }
  .hero-title .pink  { color: var(--pink); }
  .hero-title .blue  { color: var(--blue-dim); }
  .hero-title .green { color: var(--green-dim); }
  .hero-title .small { font-size: 72px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.02em; }
  .hero-divider {
    width: 320px; height: 5px;
    background: var(--pink);
    border-radius: 3px;
    margin: 48px 0 40px;
  }
  .hero-sub {
    font-size: 42px;
    font-weight: 300;
    color: var(--ink-2);
    line-height: 1.4;
    letter-spacing: -0.01em;
    max-width: 1400px;
  }
  .hero-sub strong { font-weight: 600; color: var(--ink); }

  .hero-footer {
    position: absolute; bottom: 96px; left: 160px;
    display: flex; align-items: center; gap: 28px;
  }
  .hero-footer .dots { display: flex; gap: 12px; }
  .hero-footer .dots i {
    width: 14px; height: 14px; border-radius: 50%; display: inline-block;
  }
  .hero-footer .dots i:nth-child(1) { background: var(--amber); }
  .hero-footer .dots i:nth-child(2) { background: var(--pink); }
  .hero-footer .dots i:nth-child(3) { background: var(--blue); }
  .hero-footer .meta {
    font-size: 24px; color: var(--muted); letter-spacing: 0.08em;
  }
  .hero-corner {
    position: absolute; bottom: 96px; right: 160px;
    font-size: 22px; color: var(--muted-2); letter-spacing: 0.2em;
    font-weight: 500;
  }
  .layout-hero.part2 {
    background:
      radial-gradient(ellipse at top right, var(--blue-soft) 0%, transparent 55%),
      radial-gradient(ellipse at bottom left, var(--amber-soft) 0%, transparent 50%),
      var(--bg);
  }
  .layout-hero.part2 .hero-label::before { background: var(--blue); }
  .layout-hero.part2 .hero-divider { background: var(--amber); }

  .layout-hero.part3 {
    background:
      radial-gradient(ellipse at top right, var(--pink-soft) 0%, transparent 55%),
      radial-gradient(ellipse at bottom left, var(--blue-soft) 0%, transparent 50%),
      var(--bg);
  }
  .layout-hero.part3 .hero-label::before { background: var(--pink); }
  .layout-hero.part3 .hero-divider { background: var(--blue); }

  .layout-hero.part4 {
    background:
      radial-gradient(ellipse at top right, var(--green-soft) 0%, transparent 55%),
      radial-gradient(ellipse at bottom left, var(--amber-soft) 0%, transparent 50%),
      var(--bg);
  }
  .layout-hero.part4 .hero-label::before { background: var(--green); }
  .layout-hero.part4 .hero-divider { background: var(--amber); }

  /* CALLOUT */
  .block-callout {
    background: var(--amber-soft);
    border: 1.5px solid var(--amber);
    padding: 36px 44px;
    border-radius: 12px;
    font-size: 32px;
    line-height: 1.55;
    color: var(--ink);
  }
  .block-callout .callout-key {
    display: block;
    font-size: 22px;
    font-weight: 800;
    color: var(--amber-dim);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .block-callout strong { color: var(--ink); font-weight: 800; }
  .block-callout.pink { background: var(--pink-soft); border-color: var(--pink); }
  .block-callout.pink .callout-key { color: var(--pink-dim); }
  .block-callout.blue { background: var(--blue-soft); border-color: var(--blue); }
  .block-callout.blue .callout-key { color: var(--blue-dim); }
  .block-callout.green { background: var(--green-soft); border-color: var(--green); }
  .block-callout.green .callout-key { color: var(--green-dim); }

  /* QUOTE */
  .block-quote {
    background: var(--paper);
    border-left: 5px solid var(--amber);
    padding: 44px 52px;
    border-radius: 6px;
    font-size: 40px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .block-quote.pink { border-left-color: var(--pink); }
  .block-quote.blue { border-left-color: var(--blue); }
  .block-quote.green { border-left-color: var(--green); }
  .block-quote .quote-src {
    display: block;
    margin-top: 20px;
    font-size: 26px;
    font-weight: 500;
    color: var(--muted);
  }

  /* TABLE */
  .block-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 28px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .block-table th, .block-table td {
    padding: 22px 28px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid var(--line);
  }
  .block-table tbody tr:last-child td { border-bottom: none; }
  .block-table thead th {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--paper);
    border-bottom: 2px solid var(--line-strong);
  }
  .block-table td.strong { font-weight: 800; }
  .block-table td.amber  { color: var(--amber-dim); font-weight: 800; }
  .block-table td.pink   { color: var(--pink-dim);  font-weight: 800; }
  .block-table td.blue   { color: var(--blue-dim);  font-weight: 800; }
  .block-table td.green  { color: var(--green-dim); font-weight: 800; }
  .block-table td.danger { color: var(--danger);    font-weight: 800; }
  .block-table td.muted  { color: var(--muted); }
  .block-table td code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 24px;
    background: var(--paper);
    padding: 2px 8px; border-radius: 4px;
  }
  .block-table.lg { font-size: 32px; }
  .block-table.lg th, .block-table.lg td { padding: 28px 34px; }
  .block-table.lg thead th { font-size: 24px; }

  /* STEPS */
  .block-steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px;
    align-items: stretch;
  }
  .block-steps.three { grid-template-columns: repeat(3, 1fr); }
  .block-steps.five  { grid-template-columns: repeat(5, 1fr); }
  .step-card {
    position: relative;
    background: var(--amber-soft);
    border-radius: 12px;
    padding: 36px 36px 32px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .step-card.pink  { background: var(--pink-soft); }
  .step-card.blue  { background: var(--blue-soft); }
  .step-card.green { background: var(--green-soft); }
  .step-card .step-label {
    font-size: 22px;
    font-weight: 800;
    color: var(--amber-dim);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .step-card.pink  .step-label { color: var(--pink-dim); }
  .step-card.blue  .step-label { color: var(--blue-dim); }
  .step-card.green .step-label { color: var(--green-dim); }
  .step-card .step-title {
    font-size: 42px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .step-card .step-desc {
    font-size: 26px;
    color: var(--ink-2);
    line-height: 1.5;
    margin-top: 6px;
  }
  .step-card + .step-card::before {
    content: "→";
    position: absolute;
    left: -22px; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 30px; font-weight: 700;
    color: var(--amber);
  }

  /* COMPARE */
  .block-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
  }
  .compare-card {
    padding: 44px 48px;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  .compare-card.before { background: var(--paper); }
  .compare-card.after  {
    background: var(--amber-soft);
    border-color: var(--amber-border);
  }
  .compare-card.blue {
    background: var(--blue-soft);
    border-color: rgba(59,130,246,0.45);
  }
  .compare-card.green {
    background: var(--green-soft);
    border-color: rgba(22,163,74,0.45);
  }
  .compare-card.pink {
    background: var(--pink-soft);
    border-color: rgba(236,72,153,0.45);
  }
  .compare-card .c-label {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    margin-bottom: 20px;
    color: var(--muted);
  }
  .compare-card.after .c-label { color: var(--amber-dim); }
  .compare-card.blue .c-label { color: var(--blue-dim); }
  .compare-card.green .c-label { color: var(--green-dim); }
  .compare-card.pink .c-label { color: var(--pink-dim); }
  .compare-card .c-text {
    font-size: 32px;
    font-weight: 500;
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .compare-card.before .c-text { color: var(--ink-2); font-weight: 400; }
  .compare-card .c-text strong { font-weight: 800; color: var(--amber-dim); }
  .compare-card.before .c-text strong { color: var(--ink); }
  .compare-card.blue .c-text strong { color: var(--blue-dim); }
  .compare-card.green .c-text strong { color: var(--green-dim); }
  .compare-card.pink .c-text strong { color: var(--pink-dim); }
  .compare-card ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .compare-card ul li { padding-left: 32px; position: relative; font-size: 28px; line-height: 1.4; }
  .compare-card.before ul li::before { content: "·"; position: absolute; left: 8px; top: -2px; color: var(--muted); font-weight: 800; }
  .compare-card.after ul li::before  { content: "✓"; position: absolute; left: 0; top: 0; color: var(--amber-dim); font-weight: 800; }
  .compare-card.blue  ul li::before  { content: "✓"; position: absolute; left: 0; top: 0; color: var(--blue-dim);  font-weight: 800; }
  .compare-card.green ul li::before  { content: "✓"; position: absolute; left: 0; top: 0; color: var(--green-dim); font-weight: 800; }
  .compare-card.pink  ul li::before  { content: "✓"; position: absolute; left: 0; top: 0; color: var(--pink-dim);  font-weight: 800; }

  /* CELLS */
  .block-cells {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .block-cells.three { grid-template-columns: repeat(3, 1fr); }
  .block-cells.two   { grid-template-columns: repeat(2, 1fr); }
  .block-cells.five  { grid-template-columns: repeat(5, 1fr); }
  .cell {
    padding: 32px 34px;
    background: var(--paper);
    border-radius: 10px;
  }
  .cell.amber { background: var(--amber-soft); }
  .cell.pink  { background: var(--pink-soft); }
  .cell.blue  { background: var(--blue-soft); }
  .cell.green { background: var(--green-soft); }
  .cell .cell-role {
    font-size: 22px; font-weight: 800; color: var(--muted);
    letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 12px;
  }
  .cell.amber .cell-role { color: var(--amber-dim); }
  .cell.pink  .cell-role { color: var(--pink-dim); }
  .cell.blue  .cell-role { color: var(--blue-dim); }
  .cell.green .cell-role { color: var(--green-dim); }
  .cell .cell-name {
    font-size: 32px; font-weight: 800; color: var(--ink);
    line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 10px;
  }
  .cell .cell-desc {
    font-size: 24px; color: var(--ink-2); line-height: 1.5;
  }
  .block-cells.lg .cell { padding: 40px 42px; }
  .block-cells.lg .cell .cell-role { font-size: 26px; margin-bottom: 16px; }
  .block-cells.lg .cell .cell-name { font-size: 42px; margin-bottom: 14px; }
  .block-cells.lg .cell .cell-desc { font-size: 28px; line-height: 1.5; }

  /* SUMMARY */
  .block-summary {
    background: var(--paper);
    border: 2px solid var(--amber);
    border-radius: 16px;
    padding: 44px 56px;
    font-size: 32px;
    line-height: 1.55;
  }
  .block-summary ol {
    list-style: none; counter-reset: s;
    display: flex; flex-direction: column; gap: 14px;
  }
  .block-summary ol li {
    counter-increment: s;
    padding-left: 56px;
    position: relative;
  }
  .block-summary ol li::before {
    content: counter(s) ".";
    position: absolute; left: 0; top: 0;
    color: var(--amber-dim); font-weight: 800;
  }
  .block-summary ul {
    list-style: none;
    display: flex; flex-direction: column; gap: 14px;
  }
  .block-summary ul li {
    padding-left: 38px;
    position: relative;
  }
  .block-summary ul li::before {
    content: "•";
    position: absolute; left: 8px; top: -4px;
    color: var(--amber-dim); font-weight: 800; font-size: 38px;
  }
  .block-summary strong { font-weight: 800; }
  .block-summary.pink { border-color: var(--pink); }
  .block-summary.pink ol li::before { color: var(--pink-dim); }
  .block-summary.pink ul li::before { color: var(--pink-dim); }
  .block-summary.blue { border-color: var(--blue); }
  .block-summary.blue ol li::before { color: var(--blue-dim); }
  .block-summary.blue ul li::before { color: var(--blue-dim); }
  .block-summary.green { border-color: var(--green); }
  .block-summary.green ol li::before { color: var(--green-dim); }
  .block-summary.green ul li::before { color: var(--green-dim); }

  /* IMAGE BLOCK */
  .block-image {
    background: var(--paper);
    border-radius: 16px;
    flex: 1;
    min-height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 24px;
  }
  .block-image.plain { background: transparent; padding: 0; }
  .block-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  /* SPLIT */
  .block-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    flex: 1;
    min-height: 0;
    align-items: center;
  }
  .block-split.right-narrow { grid-template-columns: 1fr 0.9fr; }
  .split-text { display: flex; flex-direction: column; gap: 24px; }
  .split-image {
    display: flex; align-items: center; justify-content: center;
    background: var(--paper);
    border-radius: 16px;
    overflow: hidden;
    padding: 20px;
    height: 100%;
  }
  .split-image.plain { background: transparent; padding: 0; }
  .split-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* BULLETS */
  .block-bullets {
    font-size: 34px;
    line-height: 1.55;
    color: var(--ink);
    display: flex; flex-direction: column; gap: 16px;
  }
  .block-bullets li {
    list-style: none;
    padding-left: 36px;
    position: relative;
  }
  .block-bullets li::before {
    content: "•";
    position: absolute; left: 8px; top: -4px;
    color: var(--blue-dim); font-weight: 800; font-size: 36px;
  }
  .block-bullets li.amber::before { color: var(--amber-dim); }
  .block-bullets li.pink::before  { color: var(--pink-dim); }
  .block-bullets li.green::before { color: var(--green-dim); }
  .block-bullets strong { font-weight: 800; }

  /* MEGA */
  .block-mega {
    background: var(--paper);
    border-radius: 16px;
    padding: 56px 64px;
    font-size: 44px;
    font-weight: 700;
    text-align: center;
    line-height: 1.4;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .block-mega .mega-vs {
    display: block;
    font-size: 32px;
    color: var(--muted);
    margin: 20px 0;
    font-weight: 800;
    letter-spacing: 0.2em;
  }
  .block-mega .mega-line { display: block; margin: 6px 0; }
  .block-mega .amber { color: var(--amber-dim); }
  .block-mega .blue  { color: var(--blue-dim); }
  .block-mega .pink  { color: var(--pink-dim); }
  .block-mega .green { color: var(--green-dim); }

  /* per-slide size tweaks */
  .slide.bigger .compare-card .c-text { font-size: 38px; line-height: 1.45; }
  .slide.bigger .compare-card .c-label { font-size: 28px; }
  .slide.bigger .compare-card ul li { font-size: 32px; line-height: 1.55; }
  .slide.bigger .block-callout { font-size: 38px; line-height: 1.55; }
  .slide.bigger .block-callout .callout-key { font-size: 26px; }
  .slide.bigger .cell .cell-name { font-size: 38px; }
  .slide.bigger .cell .cell-desc { font-size: 28px; line-height: 1.6; }
  .slide.bigger .cell .cell-role { font-size: 26px; }

  .slide.smaller .block-table.lg { font-size: 26px; }
  .slide.smaller .block-table.lg th, .slide.smaller .block-table.lg td { padding: 20px 26px; }
  .slide.smaller .block-table.lg thead th { font-size: 20px; }
