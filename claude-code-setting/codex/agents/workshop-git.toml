# PART 5: 검토 회차 기록 규칙

매 검토 시 아래 양식을 **로그 파일에 추가(append)** 합니다. 기록 없이 다음 회차로 진행할 수 없습니다.

## 로그 파일 규칙

- 검토 대상이 `XX-name.md`이면 로그 파일은 **같은 폴더**에 `XX-name.review.md`로 생성합니다
- 예: `00-overview.md` -> `00-overview.review.md`
- 매 회차 결과를 로그 파일 **맨 아래에 추가**합니다 (덮어쓰기 금지)
- 로그 파일이 없으면 새로 생성합니다
- **로그 파일에 기록이 없는 회차는 존재하지 않는 것으로 간주합니다**
- **회차별 기록이 없으면 유효한 시도로 인정하지 않음**

## 회차 기록 양식

```
## N회차

- 일시: YYYY-MM-DD HH:MM
- 실패 항목: [번호] [항목명] — [구체적 이유] (없으면 "없음")
- 수정 요청 내용: [수정 지시] (없으면 "없음")
- 이전 회차 대비 변경된 내용: [실제로 무엇이 바뀌었는지. 첫 회차는 "최초 작성"으로 기재]
- 최종 판정: 통과 / 수정 필요 / 사람에게 전달
```

## 최종 판정

- **통과**: 모든 항목 통과 -> 로그에 "통과" 기록
- **수정 필요**: 실패 항목과 이유를 로그에 기록 -> 수정 -> 재검토
- **사람에게 전달**: 로그 파일에서 연속 5회차 동안 실패 항목이 동일하고 변경된 내용이 없는 경우. 로그 파일 전체를 첨부하여 전달. 총 시도 횟수가 아니라 **변화 없는 실패의 연속 횟수**가 기준이며, 로그 파일의 기록으로만 판단합니다

