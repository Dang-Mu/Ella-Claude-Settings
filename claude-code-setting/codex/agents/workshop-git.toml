# PART 3: 검토 체크리스트 — Overview

초안 MD와 레포 코드를 함께 읽고 아래 항목을 순서대로 검토합니다.
각 항목은 **통과 / 실패 / 수정 필요** 중 하나로 판정하고, 실패/수정 시 구체적인 이유를 기록합니다.

## 3-1. 구조 완전성

| # | 항목 |
|---|------|
| 1-1 | 제목이 존재하는가 |
| 1-2 | `## 이번 실습에서 구성해볼 아키텍처` 섹션이 있는가 |
| 1-3 | `## 실습 흐름` 섹션이 있는가 |
| 1-4 | 실습 흐름 내 이미지 플레이스홀더 `[이미지: ...]`가 있는가 |
| 1-5 | `## 모듈별 학습 목표 및 진행 사항` 섹션이 있는가 |
| 1-6 | `## 실습 순서` 섹션이 있는가 |
| 1-7 | `## 사용하는 AWS 서비스` 섹션이 있는가 |
| 1-8 | 섹션 순서가 위 순서와 일치하는가 |

## 3-2. 내용 정확성 (코드 대조)

| # | 항목 |
|---|------|
| 2-1 | 언급된 기술 스택이 실제 코드(`package.json`, import)에 존재하는가 |
| 2-2 | 언급된 아키텍처 패턴/개념이 코드에서 실제로 구현되어 있는가 |
| 2-3 | 코드에 없는 용어(예: SPA, MSA, CI/CD 등)를 임의로 사용하지 않았는가 |
| 2-4 | 사용 AWS 서비스 목록이 코드에서 실제로 호출하는 서비스와 일치하는가 |
| 2-5 | 모듈별 기술 스택 표의 내용이 해당 폴더 코드와 일치하는가 |
| 2-6 | 모듈 간 "변경점" 설명이 실제 코드 차이를 정확히 반영하는가 |

## 3-3. 아키텍처 중심 서술

| # | 항목 |
|---|------|
| 3-1 | 제목에 앱 이름이 아닌 아키텍처 개념이 담겨 있는가 |
| 3-2 | "어떤 앱을 만든다"는 표현 없이 아키텍처 구성을 서술하고 있는가 |
| 3-3 | 각 실습 흐름 단계가 아키텍처 계층/전환 기준으로 구분되어 있는가 |
| 3-4 | 각 단계 설명에 "이전 단계의 한계 -> 이 단계에서의 해결" 구조가 있는가 |
| 3-5 | 마지막 단계를 제외한 각 단계에 "하지만 [한계]" 문장이 있는가 |

## 3-4. 실습 순서 & AWS 서비스 표 일관성

| # | 항목 |
|---|------|
| 4-1 | Lab 제목이 10자 이내로 간결한가 |
| 4-2 | Lab 내용이 20자 이내로 간결한가 |
| 4-3 | AWS 서비스 표의 "사용 Lab" 번호가 실습 순서 표의 Lab 번호와 일치하는가 |
| 4-4 | Lab 수가 과도하게 세분화되지 않았는가 (모듈 수의 2배 이하 권장) |

## 3-5. 문체

| # | 항목 |
|---|------|
| 5-1 | 전체 문장이 "~ㅂ니다"체로 작성되었는가 |
| 5-2 | 음슴체("~임", "~됨", "~없음") 문장이 없는가 |
| 5-3 | 명사형 종결 어미로 끝나는 문장이 없는가 |

