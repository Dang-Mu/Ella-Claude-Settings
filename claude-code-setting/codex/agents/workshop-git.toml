# PART 2: 작성 규칙 — 모듈 MD

## 입력

- GitHub 레포지토리 로컬 클론 경로
- 작성 대상 모듈 번호 및 폴더

## 작업 순서

### Step 1. 모듈 파악

아래 항목을 파악합니다.

1. **이 모듈의 핵심 목표** — 학습자가 이 모듈을 마치면 무엇을 할 수 있는가
2. **단계 구성** — 하위 섹션(1-1, 1-2...)이 몇 개이며 각각 무엇을 달성하는가
3. **각 단계의 핵심 학습** — 이 단계에서 학습자가 익혀야 할 개념이 무엇인가
4. **실행에 필요한 명령어** — 각 단계에서 학습자가 실제로 입력할 명령어
5. **시각적 결과가 있는 단계** — 실행 시 화면에 결과가 표시되는 단계

> 파일 내용 자체가 아닌 **단계적 목표 달성 흐름**을 파악하는 것이 핵심입니다.

### Step 2. 모듈 MD 작성

#### 섹션 1. 모듈 제목

```
# 모듈 N: [모듈명]
```

#### 섹션 2. 핵심 목표

```
## 핵심 목표

- 학습자가 이 모듈을 마치면 할 수 있는 것 1
- 학습자가 이 모듈을 마치면 할 수 있는 것 2
- ...
```

**규칙:**
- 문장형 금지. 반드시 불릿 리스트 형식 (`- `, 체크박스 아님)
- 앱 기능 나열 금지. 학습자가 익히는 것 중심으로 작성
- 3~5개 항목

#### 섹션 3. 단계별 실습

각 단계(1-N)마다 아래 구조를 따릅니다.

```
---

### 1-N. [서비스/도구 이름]

[이 단계에서 무엇을 달성하는지 목표 서술 — 1~2문장]

**실습 목표**
- 할 일 1
- 할 일 2

---

**[개념명]**

[초심자 기준 최대 두 문단. 이 개념을 모르는 사람이 단계를 따라가는 데 필요한 최소한의 설명]

```코드
// 핵심 구조만 표시. 불필요한 부분은 ... 으로 생략
핵심 코드
...
```

**[다음 개념명]** (필요한 경우)

[설명]

```코드
...
```

---

**실습**

[친절한 지시문 — "아래 명령어를 입력하세요." 수준]

```bash
# 명령어 설명 (명령어 위 줄에 주석)
명령어
```

[이미지: 실행 결과 화면 설명 — 추후 캡처 필요]
```

**단계 작성 규칙:**

| 항목 | 규칙 |
|------|------|
| 개념 설명 | 최대 두 문단. 학습 목표와 직결된 개념만 |
| 코드 스니펫 | 핵심 구조만, 생략은 `...` 사용 |
| 개념-코드 묶음 | 개념 하나 -> 코드 하나 세트로 구성 |
| 코드 표시 기준 | 학습자가 실행/수정해야 하는 코드, 또는 핵심 개념이 담긴 코드만 표시 |
| 코드 표시 금지 | 파일 내용 자체(HTML 레이아웃, 앱 콘텐츠 등), 학습 목표와 무관한 구현 세부사항 |
| 실습 지시문 | "입력하세요." 수준의 친절한 말투 |
| 명령어 주석 | 명령어 **위 줄**에 작성 |
| 실습 블록 분리 | 실행 파일이 다르거나 확인할 장면이 다르면 실습 블록 분리 |
| 이미지 | 실행 시 시각적 결과가 있으면 플레이스홀더 필수. "추후 캡처 필요" 메모 포함 |

## 인프라 설명 원칙

### "막히면 해결한다" 원칙

인프라 설정(EC2, 보안그룹, S3 등)을 미리 다 준비하지 않습니다. 학습자가 실습을 따라하다가 문제에 부딪히면, 그때 원인을 설명하고 해결하는 흐름으로 작성합니다.

**예시 흐름:**
```
1. node server.js 실행 -> "command not found"
   -> Node.js를 설치해야 합니다. (설치 명령어)
2. 서버 실행 성공 -> 브라우저에서 접속 -> 접속 안 됨
   -> 보안그룹에서 해당 포트를 열어야 합니다. (콘솔 절차)
3. 다시 접속 -> 성공
```

### AWS 콘솔 기반 설명

- AWS 리소스 생성은 **AWS Management Console** 기반으로 설명합니다
- 셸 스크립트 실행이 아니라, 학습자가 콘솔에서 직접 단계별로 수행하도록 안내합니다
- 콘솔 조작 단계마다 이미지 플레이스홀더를 넣습니다

