# PART 4: 검토 체크리스트 — 모듈 MD

## 4-1. 구조 완전성

| # | 항목 |
|---|------|
| 1-1 | `# 모듈 N: [모듈명]` 제목이 있는가 |
| 1-2 | `## 핵심 목표` 섹션이 있는가 |
| 1-3 | 핵심 목표가 불릿 리스트 형식(`- `)인가 |
| 1-4 | 핵심 목표 항목이 3~5개인가 |
| 1-5 | 각 단계(`### 1-N.`)에 단계 제목이 있는가 |
| 1-6 | 각 단계에 `**실습 목표**` 체크리스트가 있는가 |
| 1-7 | 각 단계에 개념 설명이 있는가 |
| 1-8 | 각 단계에 `**실습**` 섹션이 있는가 |
| 1-9 | 실습 결과가 시각적으로 표시되는 단계에 이미지 플레이스홀더가 있는가 |

## 4-2. 내용 정확성 (코드 대조)

| # | 항목 |
|---|------|
| 2-1 | 언급된 개념/기술이 실제 코드에 존재하는가 |
| 2-2 | 코드 스니펫이 실제 파일의 내용과 일치하는가 |
| 2-3 | 실습 명령어가 실제로 동작하는 경로/명령어인가 |
| 2-4 | 코드에 없는 개념/용어를 임의로 사용하지 않았는가 |

## 4-3. 학습 중심 서술

| # | 항목 |
|---|------|
| 3-1 | 핵심 목표가 앱 기능이 아닌 학습자가 익히는 것 중심인가 |
| 3-2 | 개념 설명이 AI 코드 분석 리뷰가 아닌 학습자 관점의 설명인가 |
| 3-3 | 학습 목표와 무관한 앱 기능을 자랑하듯 나열하지 않았는가 |
| 3-4 | 파일별 나열 구성이 아닌 단계적 목표 달성 흐름으로 구성되었는가 |

## 4-4. 코드 및 실습 형식

| # | 항목 |
|---|------|
| 4-1 | 코드 스니펫이 핵심 구조만 담고 있는가 (불필요한 부분은 `...` 생략) |
| 4-2 | 개념-코드가 하나씩 묶여 있는가 (개념 설명 -> 코드 순서) |
| 4-3 | 학습자가 실행/수정해야 하는 코드만 표시하고 있는가 |
| 4-4 | 명령어 주석이 명령어 위 줄에 작성되어 있는가 |
| 4-5 | 실행 파일이 다르거나 확인 장면이 다르면 실습 블록이 분리되어 있는가 |
| 4-6 | 이미지 플레이스홀더에 "추후 캡처 필요" 메모가 포함되어 있는가 |

## 4-5. AWS 인프라 흐름 (해당 시)

AWS 리소스 설정이 포함된 모듈에서만 검토합니다.

| # | 항목 |
|---|------|
| 5-1 | AWS 리소스 설정이 "시도 -> 막힘 -> 원인 설명 -> 해결" 흐름으로 작성되었는가 |
| 5-2 | 보안그룹/권한 등의 설정을 미리 안내하지 않고, 학습자가 막힌 시점에 해결하는가 |
| 5-3 | AWS 콘솔 조작 단계마다 이미지 플레이스홀더가 있는가 |
| 5-4 | AWS 실습 조건(PART 6)의 네이밍 규칙과 설정값이 반영되었는가 |

## 4-6. 문체

| # | 항목 |
|---|------|
| 6-1 | 전체 문장이 "~ㅂ니다"체로 작성되었는가 |
| 6-2 | 음슴체("~임", "~됨", "~없음") 문장이 없는가 |
| 6-3 | 명사형 종결 어미로 끝나는 문장이 없는가 |

