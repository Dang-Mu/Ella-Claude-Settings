# PART 6: AWS 실습 조건

모든 모듈에서 AWS 리소스를 생성할 때 아래 조건을 반드시 따릅니다.

## 네이밍 규칙

- 모든 AWS 리소스 이름은 **자신의 IAM 이름**으로 시작합니다
- 예: IAM 이름이 `student01`이면 -> `student01-ec2`, `student01-s3-bucket`

## EC2 인스턴스

| 항목 | 값 |
|------|-----|
| AMI | 내 AMI에서 `nxtcloud-ami-v`로 시작하는 AMI 선택 |
| 인스턴스 타입 | `t3.small` |
| 보안그룹 | EC2 생성 시 함께 생성 |
| 인스턴스 프로파일 | 자신의 IAM 이름으로 시작하는 프로파일 선택 |

## AMI 사전 설치 소프트웨어

| 소프트웨어 | 버전 |
|-----------|------|
| Node.js | v22.21.1 |
| Git | 2.50.1 |
| Python | 3.12.12 |
| MySQL 클라이언트 | 설치됨 |
| PostgreSQL 클라이언트 | 설치됨 |
| code-server | 설치됨 (포트 9080) |

## 개발 환경: code-server

- `http://{인스턴스IP}:9080`으로 접속하면 브라우저 기반 IDE(VS Code)를 사용할 수 있습니다
- **모든 코드 편집과 터미널 작업은 code-server에서 진행합니다**
- code-server 접속을 위해 보안그룹에 9080 포트가 열려 있어야 합니다

## 보안그룹 생성 순서 (중요)

1. EC2 생성 시 보안그룹을 **함께 생성**합니다
2. 보안그룹이 생성되면 **Lambda가 자동으로 태그를 부착**합니다
3. 태그가 부착된 **이후에** 보안그룹 규칙을 추가할 수 있는 권한이 생깁니다
4. 따라서: **보안그룹 생성 -> (잠시 대기) -> 인바운드 규칙 추가** 순서를 지켜야 합니다
5. 보안그룹 생성 직후 바로 규칙을 추가하면 권한 오류가 발생할 수 있습니다

## RDS (MySQL)

- MySQL 데이터베이스는 **사전 생성하여 전달**합니다
- 동시에 많은 참가자가 RDS를 생성할 수 없기 때문입니다
- 접속 정보(호스트, 사용자, 비밀번호, DB명)는 별도 안내됩니다
- **RDS 생성 방법은 별도 가이드로 제공합니다** — 참가자가 직접 만드는 방법을 알 수 있도록 별도 단계 문서를 작성합니다

## 참조 방법

모듈 MD에서 EC2를 처음 생성하는 단계에서 이 조건을 안내하고, 이후 모듈에서는 "AWS 실습 조건을 참고하세요"로 참조합니다.

