# PART 1: 작성 규칙 — Overview

## 입력

- GitHub 레포지토리 URL
- 로컬 클론 경로 (또는 직접 클론)

## 작업 순서

### Step 1. 코드 파악

레포를 클론하고 아래 항목을 파악합니다.

1. **폴더 구조** — 최상위 폴더 목록과 각 폴더의 역할
2. **기술 스택** — 각 폴더의 `package.json`, 주요 import, 언어 확인
3. **아키텍처 흐름** — 폴더 순서대로 어떤 구성 요소가 추가/변경되는지
4. **AWS 서비스** — 코드에서 실제로 사용하는 AWS 서비스만 목록화 (`boto3`, `aws s3`, Lambda URL 등)
5. **모듈 간 차이** — 이전 모듈 대비 무엇이 달라졌는지 (추가된 패키지, 새로운 엔드포인트, DB 스키마 변경 등)

> 코드에 존재하지 않는 개념, 패턴, 용어는 절대 사용하지 않습니다.

### Step 2. Overview MD 작성

아래 섹션 순서와 규칙을 반드시 따릅니다.

#### 섹션 1. 제목

```
# [핵심 아키텍처 개념] 핸즈온: [시작점]부터 [도착점]까지
```

앱 이름이 아니라 아키텍처 개념이 제목에 들어가야 합니다.

#### 섹션 2. 이번 실습에서 구성해볼 아키텍처

**구성:**

1. 한 줄 도입 — 어떤 아키텍처를 무엇을 목적으로 구축하는지
2. 아키텍처 정의 — 이 실습의 핵심 아키텍처 개념을 정의하고 구성 요소를 설명
3. 진화 서술 — 몇 단계에 걸쳐 어떻게 변화하는지, 각 단계가 이전 단계의 한계를 어떻게 해결하는지

**규칙:**
- "어떤 앱을 만든다"는 표현 금지. 아키텍처 구성이 목적
- 단계 수는 실제 폴더/모듈 수에서 도출

#### 섹션 3. 실습 흐름

**구성:**

```
[이미지: 전체 아키텍처 진화 다이어그램 — 각 단계에서 추가/변경되는 구성 요소가 표시됨]
```

이후 각 단계별로:

```
### (N) 단계 제목

[이 단계에서 구성하는 것 서술]

이 단계가 끝나면 [할 수 있는 것]입니다. 하지만 [남은 한계]입니다.
```

- 단계 제목은 아키텍처 계층/전환 기준 (예: "프레젠테이션 티어 구축", "3티어 아키텍처", "AI 연동", "서버리스 전환")
- 마지막 단계에는 "하지만" 문장 불필요

#### 섹션 4. 모듈별 학습 목표 및 진행 사항

각 모듈(폴더)별로:

**첫 번째 모듈 (기초/튜토리얼):**
```
| 실습 | 기술 스택 | 핵심 학습 |
|------|-----------|-----------|
| ... | ... | ... |
```
마지막에 "이 모듈을 마치면 [할 수 있는 것]이지만, [한계]입니다."

**이후 모듈 (기능 추가/확장):**
```
| 계층 또는 변경점 | 기술 스택 또는 상세 | 핵심 학습 또는 내용 |
```
마지막에 "이 모듈을 마치면 [할 수 있는 것]입니다. 하지만 [다음 단계로 넘어가는 이유]입니다."

**최종 모듈:**
마지막에 "하지만" 문장 없이 마무리

#### 섹션 5. 실습 순서

```
| Lab | 제목 | 내용 |
|-----|------|------|
| Lab N | 짧은 제목 | 한 줄 설명 |
```

**규칙:**
- Lab 수는 모듈 수보다 세분화 가능하나 과도하게 쪼개지 않을 것
- 제목은 10자 이내, 내용은 20자 이내로 간결하게
- 내용은 "무엇을 합니다" 형식

#### 섹션 6. 사용하는 AWS 서비스

```
| 서비스 | 용도 | 사용 Lab |
|--------|------|----------|
```

**규칙:**
- 코드에서 실제로 사용하는 서비스만 포함 (`boto3.client`, `aws s3`, Lambda URL 환경변수 등으로 확인)
- 사용 Lab 번호는 섹션 5의 Lab 번호와 일치해야 함

